name: Navoiy AI Server (Cloudflare Tunnel)

on:
  workflow_dispatch:
  schedule:
    # Toshkent vaqti (UTC+5): 06:00 dan 00:00 gacha 5 daqiqalik overlap bilan uzluksiz ishlaydi,
    # 00:00 dan 06:00 gacha dam oladi.
    - cron: '0 1 * * *'     # 06:00 UZT (1-smena)
    - cron: '25 6 * * *'    # 11:25 UZT (2-smena, 5 min overlap)
    - cron: '50 11 * * *'   # 16:50 UZT (3-smena, 5 min overlap)
    - cron: '15 17 * * *'   # 22:15 UZT (4-smena, 00:00 UZT gacha ishlaydi)

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 335

    steps:
      - name: Check Tashkent rest window (00:00 - 05:50 UZT)
        id: timecheck
        run: |
          HOUR=$(TZ='Asia/Tashkent' date +%H)
          MIN=$(TZ='Asia/Tashkent' date +%M)
          echo "Tashkent time: $HOUR:$MIN"
          TOTAL_MIN=$((10#$HOUR * 60 + 10#$MIN))
          if [ "$TOTAL_MIN" -lt 350 ]; then
            echo "Resting time (00:00 - 05:50 UZT). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.timecheck.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: xwzcl/Navoiy-ai
          token: ${{ secrets.GH_PRIVATE_TOKEN }}

      - name: Set up Python 3.11
        if: steps.timecheck.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        if: steps.timecheck.outputs.skip != 'true'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install cloudflared
        if: steps.timecheck.outputs.skip != 'true'
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm -f cloudflared.deb

      - name: Start Flask (Gunicorn) and Cloudflare Tunnel
        if: steps.timecheck.outputs.skip != 'true'
        env:
          PORT: '7860'
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          QUIZAI_API_KEY: ${{ secrets.QUIZAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_REGION: ${{ secrets.AZURE_REGION }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          SITE_URL: ${{ secrets.SITE_URL }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_TUNNEL_TOKEN secret is not set!"
            exit 1
          fi

          # 1. Start Gunicorn in background (4 workers x 8 threads = 32 parallel threads)
          gunicorn app:app --bind 0.0.0.0:7860 --workers 4 --threads 8 --timeout 120 --access-logfile - --error-logfile - &
          GUNICORN_PID=$!

          # 2. Wait until local server is healthy
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:7860/; then
              echo "Gunicorn is ready on port 7860!"
              break
            fi
            sleep 1
          done

          # 3. Start Cloudflare Tunnel in background
          cloudflared tunnel --no-autoupdate run --token "$CLOUDFLARE_TUNNEL_TOKEN" &
          TUNNEL_PID=$!
          sleep 4

          # Notify Admin via Telegram Bot that server is ON
          START_TIME_UZT=$(TZ='Asia/Tashkent' date '+%H:%M:%S (%d.%m.%Y)')
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ADMIN_ID" ]; then
            MSG_ON=$(printf "🟢 Navoiy AI serveri YONDI va tayyor!\n🕒 Vaqt: %s\n🌐 Sayt: %s" "$START_TIME_UZT" "${SITE_URL:-navoiy}")
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="$TELEGRAM_ADMIN_ID" \
              --data-urlencode "text=${MSG_ON}" >/dev/null || true
          fi

          # 4. Run for up to 330 minutes (5h 30m) OR until 00:00 Tashkent time
          START_TS=$(date +%s)
          MAX_SECS=$((330 * 60))
          STOP_REASON="5 soat 30 minutlik smena tugadi (navbatdagi serverga o'tmoqda)"

          while true; do
            NOW_TS=$(date +%s)
            ELAPSED=$((NOW_TS - START_TS))
            CUR_HOUR=$(TZ='Asia/Tashkent' date +%H)

            if [ "$((10#$CUR_HOUR))" -lt 6 ]; then
              STOP_REASON="Soat 00:00 bo'ldi — tungi dam olish (00:00 - 06:00)"
              echo "00:00 UZT reached — entering night rest (00:00 - 06:00 UZT)."
              break
            fi

            if [ "$ELAPSED" -ge "$MAX_SECS" ]; then
              echo "330 minutes (5h 30m) shift complete. Handing over to next runner."
              break
            fi

            # Restart gunicorn if it ever crashes
            if ! kill -0 "$GUNICORN_PID" 2>/dev/null; then
              echo "Gunicorn exited unexpectedly, restarting..."
              gunicorn app:app --bind 0.0.0.0:7860 --workers 4 --threads 8 --timeout 120 --access-logfile - --error-logfile - &
              GUNICORN_PID=$!
            fi

            # Restart cloudflared if it ever drops
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "cloudflared exited unexpectedly, restarting..."
              cloudflared tunnel --no-autoupdate run --token "$CLOUDFLARE_TUNNEL_TOKEN" &
              TUNNEL_PID=$!
            fi

            sleep 20
          done

          echo "Shutting down gracefully..."
          END_TIME_UZT=$(TZ='Asia/Tashkent' date '+%H:%M:%S (%d.%m.%Y)')
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ADMIN_ID" ]; then
            MSG_OFF=$(printf "🟡 Navoiy AI serveri barcha ma'lumotlarni Supabase'ga SAQLADI va o'chmoqda!\n📌 Sabab: %s\n🕒 Vaqt: %s" "$STOP_REASON" "$END_TIME_UZT")
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="$TELEGRAM_ADMIN_ID" \
              --data-urlencode "text=${MSG_OFF}" >/dev/null || true
          fi
          kill -TERM "$TUNNEL_PID" "$GUNICORN_PID" 2>/dev/null || true
          wait "$TUNNEL_PID" "$GUNICORN_PID" 2>/dev/null || true
